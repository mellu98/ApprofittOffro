name: Test

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Stessa versione del deploy (render.yaml).
          python-version: "3.11"
          cache: pip
      - name: Dipendenze
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        # Database SQLite temporaneo, nessun servizio esterno: vedi tests/conftest.py
        run: pytest

  mobile:
    name: App (flutter analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Dipendenze
        run: |
          # font_awesome_flutter 10.x non compila con Flutter 3.44: correzione solo per la CI.
          printf 'dependency_overrides:\n  font_awesome_flutter: ^11.0.0\n' > pubspec_overrides.yaml
          flutter pub get
      - name: Analisi
        # Per ora blocca solo gli errori: ci sono avvisi vecchi (codice non usato) da ripulire.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
