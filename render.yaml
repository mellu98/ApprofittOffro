# Render Blueprint: web + promemoria push + Postgres, tutto a Francoforte.
# Crea tutto da Render: New > Blueprint > questo repo (branch main).
# I valori con "sync: false" li chiede Render alla creazione: non vanno mai nel repo (e' pubblico).

databases:
  - name: approfittoffro-db
    plan: basic-256mb
    region: frankfurt
    databaseName: approfittoffro
    user: approfittoffro
    postgresMajorVersion: "16"

envVarGroups:
  - name: approfittoffro-config
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_TIMEZONE
        value: Europe/Rome
      - key: PUBLIC_SITE_BASE_URL
        value: https://approfittoffro.it
      - key: SECRET_KEY
        generateValue: true
      # Email: Resend (auto = Resend se c'e' la chiave, altrimenti SMTP)
      - key: EMAIL_PROVIDER
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Google: locali sulla mappa, accesso con Google
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      # Notifiche push (Firebase): JSON dell'account di servizio su una riga
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Moderazione automatica di testi e foto
      - key: OPENAI_API_KEY
        sync: false

services:
  - type: web
    name: approfittoffro
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: cd execution && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    domains:
      - approfittoffro.it
      - www.approfittoffro.it
    # Foto e allegati su un disco persistente (il resto del filesystem si azzera a ogni deploy).
    # Per passare a Cloudflare R2 piu avanti: APP_STORAGE_BACKEND=r2, le chiavi R2_* ed
    # execution/migrate_uploads_to_r2.py per copiare i file esistenti.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: approfittoffro-db
          property: connectionString
      - key: APP_STORAGE_BACKEND
        value: local
      - key: APP_UPLOAD_FOLDER
        value: /var/data/uploads
      - fromGroup: approfittoffro-config

  # Promemoria push (evento imminente, recensione da lasciare): ogni 15 minuti.
  # Lo script manda ogni promemoria una sola volta per destinatario.
  - type: cron
    name: approfittoffro-promemoria
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: cd execution && python send_scheduled_push_reminders.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: approfittoffro-db
          property: connectionString
      # Il cron non vede il disco del web e non salva file: cartella temporanea.
      - key: APP_STORAGE_BACKEND
        value: local
      - key: APP_UPLOAD_FOLDER
        value: /tmp/approfittoffro-uploads
      - fromGroup: approfittoffro-config
